<!DOCTYPE html>
<html>
<head>
    <title>Nested List Example</title>
</head>
<body>

    <h2>My Daily Routine</h2>
    
    <!-- Ordered List (Numbered) -->
    <ol>
        <li>Morning
            <!-- Unordered List (Bulleted) nested inside -->
            <ul>
                <li>Drink water</li>
                <li>Exercise for 20 mins</li>
                <li>Eat breakfast</li>
            </ul>
        </li>
        
        <li>Work/Study
            <ul>
                <li>Check emails</li>
                <li>Complete pending tasks</li>
            </ul>
        </li>
        
        <li>Evening
            <ul>
                <li>Go for a walk</li>
                <li>Read a book</li>
            </ul>
        </li>
    </ol>

</body>
</html>
