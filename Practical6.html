<!DOCTYPE html>
<html>
<head>
    <title>Holy Grail Layout</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f4f6f9;
        }

        header {
            background-color: #1e3a8a;
            color: white;
            text-align: center;
            padding: 20px;
        }

        footer {
            background-color: #111827;
            color: white;
            text-align: center;
            padding: 15px;
        }

        .container {
            display: flex;
            flex: 1;
        }

        nav {
            background-color: #2563eb;
            color: white;
            width: 20%;
            padding: 20px;
        }

        main {
            background-color: #e5e7eb;
            color: #111827;
            width: 60%;
            padding: 20px;
        }

        aside {
            background-color: #7c3aed;
            color: white;
            width: 20%;
            padding: 20px;
        }

        h1, h2 {
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Header</h1>
    </header>

    <div class="container">

        <nav>
            <h2>Left Sidebar</h2>
            <p>Navigation Links</p>
        </nav>

        <main>
            <h2>Main Content</h2>
            <p>This is the main section of the page.</p>
        </main>

        <aside>
            <h2>Right Sidebar</h2>
            <p>Additional Information</p>
        </aside>

    </div>

    <footer>
        <h2>Footer</h2>
    </footer>

</body>
</html>
