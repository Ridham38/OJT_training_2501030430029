<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Care+ Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-teal: #00897b;
            --primary-hover: #00695c;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --google-black: #000000;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
            background-image: url('background.webp');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8fafc;
            padding: 12px;
        }

       
        .container {
            width: 100%;
            max-width: 290px; 
            margin: 0 auto;
            text-align: center;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
            padding: 16px 14px; 
            backdrop-filter: blur(10px);
        }

        .logo-wrapper {
            display: block;
            width: 100%;
            min-height: 35px;
            margin-bottom: 10px;
        }

        .logo {
            max-width: 85px; 
            height: auto;
            margin: 0 auto;
            display: block;
        }

        h1 {
            color: var(--text-dark);
            font-size: 16px; 
            font-weight: 700;
            margin-bottom: 2px;
            letter-spacing: -0.3px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 11px;
            margin-bottom: 12px;
        }

        .google-btn {
            background-color: var(--google-black);
            color: white;
            width: 100%;
            padding: 7px;
            border-radius: 5px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
            gap: 5px;
            font-size: 11px;
            transition: background-color 0.2s;
        }

        .google-btn:hover {
            background-color: #212529;
        }

        .google-icon {
            font-size: 13px;
            display: flex;
            align-items: center;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-size: 10px;
            width: 100%; 
            white-space: nowrap;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }

        .divider:not(:empty)::before { margin-right: .5em; }
        .divider:not(:empty)::after { margin-left: .5em; }

        .form-group {
            position: relative;
            margin-bottom: 14px;
            text-align: left;
            width: 100%;
        }

        .form-group label {
            position: absolute;
            top: -8px;
            left: 8px;
            background: white;
            padding: 0 3px;
            font-size: 10px;
            color: var(--text-muted);
            z-index: 10;
            font-weight: 500;
        }

        .form-group label span { color: #ef4444; }

        .input-group {
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            width: 100%;
        }

        .input-group-text {
            background-color: transparent;
            border: none;
            color: var(--text-muted);
            padding-left: 8px;
            padding-right: 6px;
            font-size: 12px;
        }

        input[type="email"], 
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 6px 8px; 
            border: none;
            box-sizing: border-box;
            font-size: 12px;
            outline: none;
            background-color: transparent;
        }

        .input-group:focus-within {
            box-shadow: 0 0 0 2px rgba(0, 137, 123, 0.1);
            border-color: var(--primary-teal) !important;
        }

        .eye-icon {
            position: absolute;
            right: 8px;
            top: 8px;
            color: var(--primary-teal);
            cursor: pointer;
            z-index: 11;
            font-size: 13px;
        }

        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 10px;
            width: 100%;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 3px;
            color: var(--text-muted);
        }

        .forgot-pass {
            color: var(--primary-teal);
            text-decoration: none;
            font-weight: 600;
        }

        .btn-submit {
            background-color: var(--primary-teal);
            color: white;
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .switch-form {
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-align: right;
            width: 100%;
        }

        .switch-form a {
            color: var(--primary-teal);
            text-decoration: none;
            font-weight: 700;
        }

        .app-promo {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px;
            text-align: left;
            width: 100%;
            margin-top: 4px;
        }

        .app-promo h3 {
            margin: 0 0 4px 0;
            font-size: 10px;
            line-height: 1.2;
            color: var(--text-dark);
            text-align: center;
        }

        .store-btns {
            display: flex;
            gap: 4px;
            width: 100%;
        }

        .store-btn {
            background: #212121;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3px 4px;
            border-radius: 3px;
            text-decoration: none;
            flex: 1;
        }

        .store-btn img { width: 12px; margin-right: 2px; }
        .store-text { font-size: 6px; display: block; line-height: 1; }
        .store-name { display: block; font-size: 8px; font-weight: 600; line-height: 1; }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
        
        <div id="login-section">
            <div class="logo-wrapper">
                <a href="Healthcare.html">
                    <img src="Healthcare+.webp" alt="Healthcare Medical Care" class="logo">
                </a>
            </div>

            <h1>Welcome to Health Care+</h1>
            <p class="subtitle">Login to your Account</p>
            <button id="login-google-btn" type="button" class="google-btn">
                <i class="bi bi-google google-icon"></i>
                Login with Google
            </button>

            <div class="divider">or continue with email</div>

            <form id="login-form">
                <div class="form-group">
                    <label>Email <span>*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input id="login-email" type="email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password <span>*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input id="login-password" type="password" style="padding-right: 25px;" required>
                    </div>
                    <span class="eye-icon">
                        <i id="eye-icon-element" class="bi bi-eye"></i>
                    </span>
                </div>

                <div class="flex-row">
                    <div class="checkbox-group">
                        <input type="checkbox" id="remember">
                        <label for="remember" style="position:static; padding:0; font-size:10px; background:transparent;">Remember me</label>
                    </div>
                    <a href="#" id="forgot-pass" class="forgot-pass">Forgot?</a>
                </div>

                <button type="submit" class="btn-submit">Login</button>
            </form>

            <div class="switch-form">
                New here? <a href="#" onclick="toggleForm()">Sign up</a>
            </div>
        </div>

        <div id="register-section" class="hidden">
            <div class="logo-wrapper">
                <a href="Healthcare.html">
                    <img src="Healthcare+.webp" alt="Healthcare Medical Care" class="logo">
                </a>
            </div>

            <h1>Join Health Care+!</h1>
            <p class="subtitle">Create your Account</p>

            <button id="register-google-btn" type="button" class="google-btn">
                <i class="bi bi-google google-icon"></i>
                Sign up with Google
            </button>

            <div class="divider">or register with email</div>

            <form id="register-form">
                <div class="form-group">
                    <label>Full Name <span>*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input id="register-name" type="text" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Email <span>*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input id="register-email" type="email" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password <span>*</span></label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input id="register-password" type="password" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Create Account</button>
            </form>

            <div class="switch-form">
                Have an account? <a href="#" onclick="toggleForm()">Login</a>
            </div>
        </div>

        <div class="app-promo">
            <h3>Get the Mobile App for Free!</h3>
            <div class="store-btns">
                <a href="#" class="store-btn">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Play Store">
                    <div class="store-content">
                        <span class="store-text">GET IT ON</span>
                        <span class="store-name">Google Play</span>
                    </div>
                </a>
                <a href="#" class="store-btn">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/3/31/Apple_logo_white.svg" alt="App Store">
                    <div class="store-content">
                        <span class="store-text">Download on the</span>
                        <span class="store-name">App Store</span>
                    </div>
                </a>
            </div>
        </div>
</div>

<script>
    function toggleForm() {
        document.getElementById('login-section').classList.toggle('hidden');
        document.getElementById('register-section').classList.toggle('hidden');
    }

    function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function showMessage(message) {
        alert(message);
    }

    function handleGoogleLogin() {
        var googleEmail = prompt('Enter your Google email to sign in:');
        if (!googleEmail) return;
        googleEmail = googleEmail.trim();
        if (!isValidEmail(googleEmail)) {
            showMessage('Please enter a valid email address.');
            return;
        }
        localStorage.setItem('hcplus-google-email', googleEmail);
        localStorage.setItem('hcplus-email', googleEmail);
        localStorage.setItem('hcplus-password', 'google-auth');
        showMessage('Signed in with Google as ' + googleEmail + '. Redirecting...');
        window.location.href = 'Healthcare.html';
    }

    function handleGoogleRegister() {
        var googleEmail = prompt('Enter your Google email to register:');
        if (!googleEmail) return;
        googleEmail = googleEmail.trim();
        if (!isValidEmail(googleEmail)) {
            showMessage('Please enter a valid email address.');
            return;
        }
        var fullName = prompt('Enter your full name for the account:');
        if (!fullName) {
            showMessage('Registration cancelled.');
            return;
        }
        localStorage.setItem('hcplus-google-email', googleEmail);
        localStorage.setItem('hcplus-email', googleEmail);
        localStorage.setItem('hcplus-name', fullName.trim());
        localStorage.setItem('hcplus-password', 'google-auth');
        showMessage('Google registration successful! Redirecting to Health Care+.');
        window.location.href = 'Healthcare.html';
    }

    function handleForgotPassword(event) {
        event.preventDefault();
        var storedEmail = localStorage.getItem('hcplus-email');
        if (!storedEmail) {
            showMessage('No account found. Please register first.');
            toggleForm();
            return;
        }
        var email = prompt('Enter your registered email for password reset:', storedEmail);
        if (!email) return;
        email = email.trim();
        if (email !== storedEmail) {
            showMessage('The provided email does not match the registered account.');
            return;
        }
        var newPassword = prompt('Enter a new password:');
        if (!newPassword) {
            showMessage('Password reset cancelled.');
            return;
        }
        localStorage.setItem('hcplus-password', newPassword);
        showMessage('Password reset successful. You can now login with your new password.');
    }

    function togglePasswordVisibility() {
        var passwordInput = document.getElementById('login-password');
        var eyeIconEl = document.getElementById('eye-icon-element');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIconEl.className = 'bi bi-eye-slash';
        } else {
            passwordInput.type = 'password';
            eyeIconEl.className = 'bi bi-eye';
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        var loginForm = document.getElementById('login-form');
        var registerForm = document.getElementById('register-form');
        var loginGoogleBtn = document.getElementById('login-google-btn');
        var registerGoogleBtn = document.getElementById('register-google-btn');
        var forgotPassLink = document.getElementById('forgot-pass');
        var eyeIcon = document.querySelector('.eye-icon');

        if (loginForm) {
            loginForm.addEventListener('submit', function(event) {
                event.preventDefault();
                var email = document.getElementById('login-email').value.trim();
                var password = document.getElementById('login-password').value.trim();
                var storedEmail = localStorage.getItem('hcplus-email');
                var storedPassword = localStorage.getItem('hcplus-password');

                if (!storedEmail || !storedPassword) {
                    showMessage('No account found. Please register first.');
                    toggleForm();
                    return;
                }
                if (email !== storedEmail) {
                    showMessage('Email is not registered. Please sign up first.');
                    return;
                }
                if (storedPassword === 'google-auth') {
                    showMessage('Logged in with Google account successfully!');
                    window.location.href = 'Healthcare.html';
                    return;
                }
                if (password !== storedPassword) {
                    showMessage('Email or password is incorrect. Please try again.');
                    return;
                }
                showMessage('Login successful!');
                window.location.href = 'Healthcare.html';
            });
        }

        if (registerForm) {
            registerForm.addEventListener('submit', function(event) {
                event.preventDefault();
                var name = document.getElementById('register-name').value.trim();
                var email = document.getElementById('register-email').value.trim();
                var password = document.getElementById('register-password').value.trim();

                if (!isValidEmail(email)) {
                    showMessage('Please enter a valid email address.');
                    return;
                }
                localStorage.setItem('hcplus-name', name);
                localStorage.setItem('hcplus-email', email);
                localStorage.setItem('hcplus-password', password);
                showMessage('Registration successful! Please login to continue.');
                toggleForm();
            });
        }

        if (loginGoogleBtn) loginGoogleBtn.addEventListener('click', handleGoogleLogin);
        if (registerGoogleBtn) registerGoogleBtn.addEventListener('click', handleGoogleRegister);
        if (forgotPassLink) forgotPassLink.addEventListener('click', handleForgotPassword);
        if (eyeIcon) eyeIcon.addEventListener('click', togglePasswordVisibility);
    });
</script>
</body>
</html>
